name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Node.js
      # ------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # ------------------------------------------------------------
      # Rust / Tauri
      # ------------------------------------------------------------
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ------------------------------------------------------------
      # Version
      #
      # package.json is the SINGLE source of truth.
      #
      # Example:
      #   package.json       -> 1.2.3
      #   GitHub tag         -> v1.2.3
      #   Tauri config       -> automatically changed to 1.2.3
      #
      # The Tauri change only happens on the CI runner and is NOT
      # committed back to the repository.
      # ------------------------------------------------------------
      - name: Validate and synchronise release version
        shell: pwsh
        run: |
          $tagVersion = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version

          Write-Host ""
          Write-Host "========================================"
          Write-Host "OpenGantt Release Version"
          Write-Host "========================================"
          Write-Host "Git tag:       v$tagVersion"
          Write-Host "package.json:  $packageVersion"
          Write-Host ""

          # The Git tag must match package.json.
          if ($tagVersion -ne $packageVersion) {
            throw "Release tag v$tagVersion does not match package.json version $packageVersion."
          }

          # Load Tauri configuration.
          $tauriPath = "src-tauri/tauri.conf.json"

          if (-not (Test-Path $tauriPath)) {
            throw "Tauri configuration not found: $tauriPath"
          }

          $tauri = Get-Content $tauriPath -Raw | ConvertFrom-Json

          # Synchronise Tauri version with package.json.
          $tauri.version = $packageVersion

          # Write it back to the CI workspace.
          $tauri | ConvertTo-Json -Depth 100 | Set-Content $tauriPath -Encoding UTF8

          # Verify the result.
          $syncedVersion = (Get-Content $tauriPath -Raw | ConvertFrom-Json).version

          Write-Host "Tauri version:  $syncedVersion"
          Write-Host ""

          if ($syncedVersion -ne $packageVersion) {
            throw "Failed to synchronise Tauri version."
          }

          Write-Host "Version check passed."
          Write-Host "All release components will use version $packageVersion."

      # ------------------------------------------------------------
      # Tests
      # ------------------------------------------------------------
      - name: Run tests
        run: npm test

      # ------------------------------------------------------------
      # Standalone application
      # ------------------------------------------------------------
      - name: Build standalone application
        run: npm run build:app

      - name: Package standalone application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          if (-not (Test-Path "dist/Gantt.html")) {
            throw "dist/Gantt.html was not created by the standalone build."
          }

          Compress-Archive `
            -Path "dist/Gantt.html" `
            -DestinationPath "release-assets/OpenGantt-${env:GITHUB_REF_NAME}-standalone.zip" `
            -CompressionLevel Optimal

          Write-Host "Standalone package created."

      # ------------------------------------------------------------
      # Obsidian plugin
      # ------------------------------------------------------------
      - name: Build Obsidian plugin
        run: npm run build

      - name: Package Obsidian plugin
        shell: pwsh
        run: |
          $pluginDir = "release-assets/OpenGantt-${env:GITHUB_REF_NAME}-Obsidian"

          New-Item -ItemType Directory -Force -Path $pluginDir | Out-Null

          if (-not (Test-Path "main.js")) {
            throw "main.js was not created by the Obsidian build."
          }

          if (-not (Test-Path "manifest.json")) {
            throw "manifest.json is missing."
          }

          if (-not (Test-Path "styles.css")) {
            throw "styles.css is missing."
          }

          Copy-Item "main.js" "$pluginDir/"
          Copy-Item "manifest.json" "$pluginDir/"
          Copy-Item "styles.css" "$pluginDir/"

          Compress-Archive `
            -Path "$pluginDir/*" `
            -DestinationPath "release-assets/OpenGantt-${env:GITHUB_REF_NAME}-Obsidian.zip" `
            -CompressionLevel Optimal

          Remove-Item $pluginDir -Recurse -Force

          Write-Host "Obsidian plugin package created."

      # ------------------------------------------------------------
      # Tauri desktop application
      # ------------------------------------------------------------
      - name: Build Tauri Windows application
        run: npx tauri build

      # ------------------------------------------------------------
      # Collect Tauri installers
      # ------------------------------------------------------------
      - name: Collect Windows installers
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/release/bundle"

          if (-not (Test-Path $bundleDir)) {
            throw "Tauri bundle directory was not created: $bundleDir"
          }

          $files = Get-ChildItem $bundleDir -Recurse -File |
            Where-Object {
              $_.Extension -in @(".msi", ".exe")
            }

          if ($files.Count -eq 0) {
            throw "No Windows MSI or EXE installers were produced."
          }

          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          foreach ($file in $files) {
            Copy-Item $file.FullName "release-assets/$($file.Name)"
            Write-Host "Collected: $($file.Name)"
          }

      # ------------------------------------------------------------
      # Show everything that will be released
      # ------------------------------------------------------------
      - name: List release assets
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Release assets"
          Write-Host "========================================"
          Write-Host ""

          Get-ChildItem "release-assets" -File |
            Select-Object Name, Length |
            Format-Table -AutoSize

      # ------------------------------------------------------------
      # Create GitHub Release
      # ------------------------------------------------------------
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "OpenGantt ${GITHUB_REF_NAME}" \
            --generate-notes