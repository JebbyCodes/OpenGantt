<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
/>

<meta
  name="theme-color"
  content="#282828"
/>

<title>Gantt</title>



<style>
/* ==========================================================================
   OpenGantt Web Shell
   Gruvbox-compatible desktop-style layout
   ========================================================================== */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
}

html {
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #282828;
  color: #ebdbb2;

  font:
    14px / 1.4 Inter,
    "Segoe UI",
    system-ui,
    sans-serif;
}

/* ==========================================================================
   Top shell
   ========================================================================== */

.top {
  position: relative;
  z-index: 20;

  display: flex;
  align-items: center;

  gap: 8px;

  min-height: 42px;
  padding: 7px 10px;

  background: #1d2021;
  border-bottom: 1px solid #504945;

  flex: 0 0 auto;
}

.top b {
  margin-right: 6px;

  color: #fabd2f;

  font-size: 15px;
  font-weight: 700;

  white-space: nowrap;
}

.top button {
  appearance: none;

  padding: 5px 11px;

  border: 1px solid #665c54;
  border-radius: 4px;

  background: #3c3836;
  color: #ebdbb2;

  font:
    inherit;

  font-size: 12px;

  cursor: pointer;

  transition:
    background 80ms ease,
    border-color 80ms ease;
}

.top button:hover {
  background: #504945;
  border-color: #7c6f64;
}

.top button:active {
  background: #665c54;
}

.top button:focus-visible {
  outline: 2px solid #fabd2f;
  outline-offset: 1px;
}

#file {
  min-width: 0;

  margin-left: 6px;

  color: #a89984;

  font-size: 12px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

  max-width: 32ch;
}

#file.is-dirty {
  color: #fbf1c7;
}

#file.is-dirty::after {
  content: " •";

  color: #fabd2f;
}

.sp {
  flex: 1 1 auto;
}

/* ==========================================================================
   Main application area
   ========================================================================== */

main {
  position: relative;

  display: grid;

  grid-template-columns: minmax(260px, 380px) minmax(0, 1fr);

  width: 100%;
  height: 100%;

  min-width: 0;
  min-height: 0;

  flex: 1 1 auto;

  overflow: hidden;
}

/* ==========================================================================
   Editor
   ========================================================================== */

#editorWrap {
  position: relative;

  display: flex;

  min-width: 0;
  min-height: 0;

  overflow: hidden;

  background: #1d2021;

  border-right: 1px solid #504945;
}

#editor {
  display: block;

  width: 100%;
  height: 100%;

  min-width: 0;
  min-height: 0;

  resize: none;

  border: 0;
  outline: 0;

  padding: 12px;

  background: #1d2021;
  color: #ebdbb2;

  font:
    13px / 1.5 ui-monospace,
    Consolas,
    Menlo,
    Monaco,
    monospace;

  tab-size: 2;

  white-space: pre;

  overflow: auto;

  caret-color: #fabd2f;
}

#editor::selection {
  background: #665c54;
  color: #fbf1c7;
}

#editor::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}

#editor::-webkit-scrollbar-track {
  background: #282828;
}

#editor::-webkit-scrollbar-thumb {
  background: #504945;
  border-radius: 4px;
}

#editor::-webkit-scrollbar-thumb:hover {
  background: #665c54;
}

/* ==========================================================================
   Chart area
   ========================================================================== */

#chart {
  position: relative;

  min-width: 0;
  min-height: 0;

  width: 100%;
  height: 100%;

  padding: 10px 14px;

  overflow: hidden;

  background: #282828;

  display: flex;
  flex-direction: column;
}

#chart > div {
  flex: 1 1 auto;

  min-width: 0;
  min-height: 0;

  display: flex;
  flex-direction: column;
}

#chart .epq-gantt-block {
  flex: 1 1 auto;

  min-width: 0;
  min-height: 0;

  margin: 0;

  display: flex;
  flex-direction: column;
}

#chart .epq-gantt-host {
  height: auto !important;

  min-width: 0;
  min-height: 0;

  flex: 1 1 auto;
}

/* ==========================================================================
   Editor closed = desktop-like full-width Gantt
   ========================================================================== */

body.editor-closed main {
  grid-template-columns: minmax(0, 1fr);
}

body.editor-closed #editorWrap {
  display: none;
}

body.editor-closed #chart {
  padding: 10px 14px;
}

/* ==========================================================================
   Editor open
   ========================================================================== */

body.editor-open main {
  grid-template-columns: minmax(260px, 380px) minmax(0, 1fr);
}

body.editor-open #editorWrap {
  display: flex;
}

/* ==========================================================================
   Toasts
   ========================================================================== */

#toasts {
  position: fixed;

  right: 16px;
  bottom: 16px;

  z-index: 9999;

  pointer-events: none;
}

/* ==========================================================================
   Mobile
   ========================================================================== */

@media (max-width: 800px) {
  .top {
    flex-wrap: nowrap;

    overflow-x: auto;

    scrollbar-width: thin;
  }

  .top b {
    flex: 0 0 auto;
  }

  .top button {
    flex: 0 0 auto;
  }

  #file {
    flex: 0 1 18ch;
  }

  main {
    grid-template-columns: 1fr;
    grid-template-rows: minmax(180px, 35%) minmax(0, 1fr);
  }

  #editorWrap {
    border-right: 0;
    border-bottom: 1px solid #504945;
  }

  body.editor-closed main {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr;
  }
}

/* ==========================================================================
   Very small screens
   ========================================================================== */

@media (max-width: 520px) {
  .top {
    gap: 5px;

    padding: 6px 7px;
  }

  .top button {
    padding: 5px 8px;
  }

  #file {
    display: none;
  }

  #chart {
    padding: 7px;
  }
}

/* ==========================================================================
   Print
   ========================================================================== */

@media print {
  html,
  body {
    height: auto;

    overflow: visible;

    background: white;
  }

  .top,
  #editorWrap,
  #toasts {
    display: none !important;
  }

  main {
    display: block;

    width: 100%;
    height: auto;
  }

  #chart {
    display: block;

    width: 100%;
    height: auto;

    padding: 0;

    overflow: visible;
  }

  #chart > div,
  #chart .epq-gantt-block,
  #chart .epq-gantt-host {
    display: block;

    width: 100%;
    height: auto !important;

    overflow: visible;
  }
}
</style>

</head>

<body>

<header class="top">

  <b>Gantt</b>

  <button
    id="open"
    type="button"
    title="Open a Markdown or YAML file"
  >
    Open…
  </button>

  <button
    id="save"
    type="button"
    title="Save"
  >
    Save
  </button>

  <button
    id="saveas"
    type="button"
    title="Save as"
  >
    Save as…
  </button>

  <button
    id="copy"
    type="button"
    title="Copy as an Obsidian Gantt block"
  >
    Copy as Obsidian block
  </button>

  <button
    id="example"
    type="button"
    title="Load the example"
  >
    Example
  </button>

  <span id="file"></span>

  <span class="sp"></span>

  <button
    id="toggle"
    type="button"
    aria-expanded="false"
    title="Show or hide the YAML editor"
  >
    Show editor
  </button>

</header>

<main>

  <section id="editorWrap">
    <textarea
      id="editor"
      spellcheck="false"
      autocapitalize="off"
      autocomplete="off"
      autocorrect="off"
      aria-label="Gantt YAML"
    ></textarea>
  </section>

  <section id="chart"></section>

</main>

<input
  type="file"
  id="picker"
  accept=".md,.markdown,.mdx,.yaml,.yml,text/plain,text/markdown"
  hidden
/>

<div id="toasts"></div>
