name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.2.10)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Node.js
      # ------------------------------------------------------------

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # ------------------------------------------------------------
      # Rust / Tauri
      # ------------------------------------------------------------

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------

      - name: Install dependencies
        run: npm ci

      # ------------------------------------------------------------
      # Version validation
      #
      # package.json and manifest.json contain:
      #
      #   1.2.10
      #
      # The Git tag contains:
      #
      #   v1.2.10
      #
      # For manual runs, the tag is generated from the entered version.
      # ------------------------------------------------------------

      - name: Validate release version
        shell: pwsh
        run: |
          $tagName = "${env:RELEASE_TAG}"

          if ($tagName -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid release tag '$tagName'. Expected format: vMAJOR.MINOR.PATCH (for example v1.2.10)."
          }

          $releaseVersion = $tagName.Substring(1)

          $packageVersion = (
            Get-Content "package.json" -Raw |
            ConvertFrom-Json
          ).version

          $manifestVersion = (
            Get-Content "manifest.json" -Raw |
            ConvertFrom-Json
          ).version

          Write-Host ""
          Write-Host "========================================"
          Write-Host "OpenGantt Release Version"
          Write-Host "========================================"
          Write-Host "Git tag:         $tagName"
          Write-Host "Release version: $releaseVersion"
          Write-Host "package.json:    $packageVersion"
          Write-Host "manifest.json:   $manifestVersion"
          Write-Host "Trigger:         ${{ github.event_name }}"
          Write-Host ""

          if ($releaseVersion -ne $packageVersion) {
            throw "Release tag $tagName does not match package.json version $packageVersion."
          }

          if ($releaseVersion -ne $manifestVersion) {
            throw "Release tag $tagName does not match manifest.json version $manifestVersion."
          }

          if ($packageVersion -ne $manifestVersion) {
            throw "package.json version $packageVersion does not match manifest.json version $manifestVersion."
          }

          Write-Host "Version check passed."
          Write-Host "Release version: $releaseVersion"

      # ------------------------------------------------------------
      # Synchronise Tauri version
      #
      # This modifies tauri.conf.json ONLY inside the CI workspace.
      # It is NOT committed back to Git.
      # ------------------------------------------------------------

      - name: Synchronise Tauri version
        shell: pwsh
        run: |
          $packageVersion = (
            Get-Content "package.json" -Raw |
            ConvertFrom-Json
          ).version

          $tauriPath = "src-tauri/tauri.conf.json"

          if (-not (Test-Path $tauriPath)) {
            throw "Tauri configuration not found: $tauriPath"
          }

          $tauri = Get-Content $tauriPath -Raw | ConvertFrom-Json

          $tauri.version = $packageVersion

          $tauri |
            ConvertTo-Json -Depth 100 |
            Set-Content $tauriPath -Encoding UTF8

          $syncedVersion = (
            Get-Content $tauriPath -Raw |
            ConvertFrom-Json
          ).version

          Write-Host "Tauri version: $syncedVersion"

          if ($syncedVersion -ne $packageVersion) {
            throw "Failed to synchronise Tauri version."
          }

      # ------------------------------------------------------------
      # Tests
      # ------------------------------------------------------------

      - name: Run tests
        run: npm test

      # ------------------------------------------------------------
      # Build standalone application
      # ------------------------------------------------------------

      - name: Build standalone application
        run: npm run build:app

      # ------------------------------------------------------------
      # Package standalone application
      # ------------------------------------------------------------

      - name: Package standalone application
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "release-assets" |
            Out-Null

          if (-not (Test-Path "dist/Gantt.html")) {
            throw "dist/Gantt.html was not created by the standalone build."
          }

          Compress-Archive `
            -Path "dist/Gantt.html" `
            -DestinationPath "release-assets/OpenGantt-${env:RELEASE_TAG}-standalone.zip" `
            -CompressionLevel Optimal

          Write-Host "Standalone package created."

      # ------------------------------------------------------------
      # Build Obsidian plugin
      #
      # The Obsidian Community Directory expects:
      #
      #   main.js
      #   manifest.json
      #   styles.css
      #
      # These are uploaded as individual release assets.
      # ------------------------------------------------------------

      - name: Build Obsidian plugin
        run: npm run build

      # ------------------------------------------------------------
      # Prepare Obsidian release assets
      # ------------------------------------------------------------

      - name: Prepare Obsidian release assets
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "release-assets" |
            Out-Null

          if (-not (Test-Path "main.js")) {
            throw "main.js was not created by the Obsidian build."
          }

          if (-not (Test-Path "manifest.json")) {
            throw "manifest.json is missing."
          }

          if (-not (Test-Path "styles.css")) {
            throw "styles.css was not created by the Obsidian build."
          }

          Copy-Item `
            "main.js" `
            "release-assets/main.js" `
            -Force

          Copy-Item `
            "manifest.json" `
            "release-assets/manifest.json" `
            -Force

          Copy-Item `
            "styles.css" `
            "release-assets/styles.css" `
            -Force

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Obsidian release assets"
          Write-Host "========================================"
          Write-Host ""

          Get-ChildItem "release-assets/main.js" |
            Select-Object Name, Length |
            Format-Table -AutoSize

          Get-ChildItem "release-assets/manifest.json" |
            Select-Object Name, Length |
            Format-Table -AutoSize

          Get-ChildItem "release-assets/styles.css" |
            Select-Object Name, Length |
            Format-Table -AutoSize

      # ------------------------------------------------------------
      # Build Tauri desktop application
      # ------------------------------------------------------------

      - name: Build Tauri Windows application
        run: npx tauri build

      # ------------------------------------------------------------
      # Collect Windows installers
      # ------------------------------------------------------------

      - name: Collect Windows installers
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/release/bundle"

          if (-not (Test-Path $bundleDir)) {
            throw "Tauri bundle directory was not created: $bundleDir"
          }

          $files = Get-ChildItem `
            $bundleDir `
            -Recurse `
            -File |
            Where-Object {
              $_.Extension -in @(".msi", ".exe")
            }

          if ($files.Count -eq 0) {
            throw "No Windows MSI or EXE installers were produced."
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "release-assets" |
            Out-Null

          foreach ($file in $files) {
            Copy-Item `
              $file.FullName `
              "release-assets/$($file.Name)" `
              -Force

            Write-Host "Collected: $($file.Name)"
          }

      # ------------------------------------------------------------
      # Verify final release assets
      # ------------------------------------------------------------

      - name: Verify release assets
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Final release assets"
          Write-Host "========================================"
          Write-Host ""

          $assets = Get-ChildItem "release-assets" -File

          if ($assets.Count -eq 0) {
            throw "No release assets were created."
          }

          $assets |
            Select-Object Name, Length |
            Format-Table -AutoSize

          Write-Host ""

          # --------------------------------------------------------
          # Required Obsidian assets
          # --------------------------------------------------------

          $requiredAssets = @(
            "main.js",
            "manifest.json",
            "styles.css"
          )

          foreach ($asset in $requiredAssets) {
            $path = Join-Path "release-assets" $asset

            if (-not (Test-Path $path)) {
              throw "Required Obsidian release asset is missing: $asset"
            }

            $item = Get-Item $path

            if ($item.Length -eq 0) {
              throw "Required release asset is empty: $asset"
            }

            Write-Host "Verified required asset: $asset"
          }

          # --------------------------------------------------------
          # Verify manifest version
          # --------------------------------------------------------

          $manifest = Get-Content `
            "release-assets/manifest.json" `
            -Raw |
            ConvertFrom-Json

          $releaseVersion = "${env:RELEASE_TAG}".Substring(1)

          if ($manifest.version -ne $releaseVersion) {
            throw "Release manifest version $($manifest.version) does not match release version $releaseVersion."
          }

          Write-Host ""
          Write-Host "All required Obsidian release assets are present."
          Write-Host "Manifest version matches release version."
          Write-Host "Release asset verification passed."

      # ------------------------------------------------------------
      # Generate GitHub artifact attestations
      #
      # Every file in release-assets is attested.
      # ------------------------------------------------------------

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            release-assets/*

      # ------------------------------------------------------------
      # Verify GitHub artifact attestations
      # ------------------------------------------------------------

      - name: Verify artifact attestations
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repository = "${env:GITHUB_REPOSITORY}"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Verifying artifact attestations"
          Write-Host "========================================"
          Write-Host ""

          $assets = Get-ChildItem "release-assets" -File

          if ($assets.Count -eq 0) {
            throw "No release assets found to verify."
          }

          foreach ($asset in $assets) {
            Write-Host "Verifying: $($asset.Name)"

            gh attestation verify `
              "$($asset.FullName)" `
              --repo "$repository"

            if ($LASTEXITCODE -ne 0) {
              throw "Artifact attestation verification failed for $($asset.Name)."
            }

            Write-Host "PASSED: $($asset.Name)"
            Write-Host ""
          }

          Write-Host "========================================"
          Write-Host "All artifact attestations verified."
          Write-Host "========================================"

      # ------------------------------------------------------------
      # Create GitHub Release
      #
      # Automatic tag run:
      #   The tag already exists.
      #
      # Manual workflow run:
      #   gh release create creates the requested tag automatically
      #   at the checked-out commit.
      # ------------------------------------------------------------

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "OpenGantt ${RELEASE_TAG}" \
            --generate-notes