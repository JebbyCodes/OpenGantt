name: Release

on:
  push:
    tags:
      - "[0-9]*"

  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.2.10)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Node.js
      # ------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # ------------------------------------------------------------
      # Rust / Tauri
      # ------------------------------------------------------------
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ------------------------------------------------------------
      # Version validation
      # Git tag, package.json and manifest.json must all match.
      # Example: 1.2.10
      # ------------------------------------------------------------
      - name: Validate release version
        shell: pwsh
        run: |
          $tagName = "${env:RELEASE_TAG}"

          if ($tagName -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid release version '$tagName'. Expected MAJOR.MINOR.PATCH, for example 1.2.10."
          }

          $releaseVersion = $tagName

          $packageVersion = (
            Get-Content "package.json" -Raw |
            ConvertFrom-Json
          ).version

          $manifestVersion = (
            Get-Content "manifest.json" -Raw |
            ConvertFrom-Json
          ).version

          Write-Host ""
          Write-Host "========================================"
          Write-Host "OpenGantt Release Version"
          Write-Host "========================================"
          Write-Host "Git tag:         $tagName"
          Write-Host "Release version: $releaseVersion"
          Write-Host "package.json:    $packageVersion"
          Write-Host "manifest.json:   $manifestVersion"
          Write-Host "Trigger:         ${{ github.event_name }}"
          Write-Host ""

          if ($releaseVersion -ne $packageVersion) {
            throw "Release tag $tagName does not match package.json version $packageVersion."
          }

          if ($releaseVersion -ne $manifestVersion) {
            throw "Release tag $tagName does not match manifest.json version $manifestVersion."
          }

          if ($packageVersion -ne $manifestVersion) {
            throw "package.json version $packageVersion does not match manifest.json version $manifestVersion."
          }

          Write-Host "Version check passed."

      # ------------------------------------------------------------
      # Synchronise Tauri version in the CI workspace
      # ------------------------------------------------------------
      - name: Synchronise Tauri version
        shell: pwsh
        run: |
          $packageVersion = (
            Get-Content "package.json" -Raw |
            ConvertFrom-Json
          ).version

          $tauriPath = "src-tauri/tauri.conf.json"

          if (-not (Test-Path $tauriPath)) {
            throw "Tauri configuration not found: $tauriPath"
          }

          $tauri = Get-Content $tauriPath -Raw | ConvertFrom-Json
          $tauri.version = $packageVersion

          $tauri |
            ConvertTo-Json -Depth 100 |
            Set-Content $tauriPath -Encoding UTF8

          $syncedVersion = (
            Get-Content $tauriPath -Raw |
            ConvertFrom-Json
          ).version

          if ($syncedVersion -ne $packageVersion) {
            throw "Failed to synchronise Tauri version."
          }

          Write-Host "Tauri version: $syncedVersion"

      # ------------------------------------------------------------
      # Tests
      # ------------------------------------------------------------
      - name: Run tests
        run: npm test

      # ------------------------------------------------------------
      # Build standalone web application
      # ------------------------------------------------------------
      - name: Build standalone application
        run: npm run build:app

      # ------------------------------------------------------------
      # Package standalone application
      # ------------------------------------------------------------
      - name: Package standalone application
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "release-assets" |
            Out-Null

          if (-not (Test-Path "dist/Gantt.html")) {
            throw "dist/Gantt.html was not created by the standalone build."
          }

          Compress-Archive `
            -Path "dist/Gantt.html" `
            -DestinationPath "release-assets/OpenGantt-${env:RELEASE_TAG}-standalone.zip" `
            -CompressionLevel Optimal

          Write-Host "Standalone package created."

      # ------------------------------------------------------------
      # Build Obsidian plugin
      # ------------------------------------------------------------
      - name: Build Obsidian plugin
        run: npm run build

      # ------------------------------------------------------------
      # Prepare Obsidian release assets
      # ------------------------------------------------------------
      - name: Prepare Obsidian release assets
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "release-assets" |
            Out-Null

          $requiredFiles = @(
            "main.js",
            "manifest.json",
            "styles.css"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Required Obsidian build file is missing: $file"
            }

            Copy-Item $file "release-assets/$file" -Force

            $item = Get-Item "release-assets/$file"

            if ($item.Length -eq 0) {
              throw "Required release asset is empty: $file"
            }

            Write-Host "Prepared: $file ($($item.Length) bytes)"
          }

      # ------------------------------------------------------------
      # Build Tauri Windows application
      # ------------------------------------------------------------
      - name: Build Tauri Windows application
        run: npx tauri build

      # ------------------------------------------------------------
      # Collect Windows installers
      # ------------------------------------------------------------
      - name: Collect Windows installers
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/release/bundle"

          if (-not (Test-Path $bundleDir)) {
            throw "Tauri bundle directory was not created: $bundleDir"
          }

          $files = @(
            Get-ChildItem $bundleDir -Recurse -File |
            Where-Object {
              $_.Extension -in @(".msi", ".exe")
            }
          )

          if ($files.Count -eq 0) {
            throw "No Windows MSI or EXE installers were produced."
          }

          foreach ($file in $files) {
            Copy-Item `
              $file.FullName `
              "release-assets/$($file.Name)" `
              -Force

            Write-Host "Collected: $($file.Name)"
          }

      # ------------------------------------------------------------
      # Verify final release assets and manifest version
      # ------------------------------------------------------------
      - name: Verify release assets
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem "release-assets" -File)

          if ($assets.Count -eq 0) {
            throw "No release assets were created."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Final release assets"
          Write-Host "========================================"

          $assets |
            Select-Object Name, Length |
            Format-Table -AutoSize

          $requiredAssets = @(
            "main.js",
            "manifest.json",
            "styles.css"
          )

          foreach ($asset in $requiredAssets) {
            $path = Join-Path "release-assets" $asset

            if (-not (Test-Path $path)) {
              throw "Required Obsidian release asset is missing: $asset"
            }

            if ((Get-Item $path).Length -eq 0) {
              throw "Required release asset is empty: $asset"
            }
          }

          $manifest = Get-Content `
            "release-assets/manifest.json" `
            -Raw |
            ConvertFrom-Json

          $releaseVersion = "${env:RELEASE_TAG}"

          if ($manifest.version -ne $releaseVersion) {
            throw "Release manifest version $($manifest.version) does not match release tag $releaseVersion."
          }

          Write-Host "All required Obsidian assets are present."
          Write-Host "Manifest version matches release tag."

      # ------------------------------------------------------------
      # Generate artifact attestations
      # ------------------------------------------------------------
      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            release-assets/*

      # ------------------------------------------------------------
      # Verify artifact attestations
      # ------------------------------------------------------------
      - name: Verify artifact attestations
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repository = "${env:GITHUB_REPOSITORY}"
          $assets = @(Get-ChildItem "release-assets" -File)

          foreach ($asset in $assets) {
            Write-Host "Verifying: $($asset.Name)"

            gh attestation verify `
              "$($asset.FullName)" `
              --repo "$repository"

            if ($LASTEXITCODE -ne 0) {
              throw "Artifact attestation verification failed for $($asset.Name)."
            }

            Write-Host "PASSED: $($asset.Name)"
          }

          Write-Host "All artifact attestations verified."

      # ------------------------------------------------------------
      # Create GitHub Release
      # Manual runs create the numeric version tag automatically.
      # ------------------------------------------------------------
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "OpenGantt ${RELEASE_TAG}" \
            --generate-notes \
            --target "${GITHUB_SHA}"