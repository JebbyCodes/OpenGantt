[package]
name = "opengantt"
version = "1.2.0"
description = "Desktop shell for OpenGantt"
authors = ["JebbyCodes"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The Rust side is only the Tauri runtime; the UI is the static frontend in web-dist/.
name = "opengantt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

