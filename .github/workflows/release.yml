name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Node.js
      # ------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # ------------------------------------------------------------
      # Rust / Tauri
      # ------------------------------------------------------------
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ------------------------------------------------------------
      # Version validation
      #
      # package.json and manifest.json must contain the same version.
      # The GitHub release tag must also match that version exactly.
      #
      # Example:
      #   package.json  -> 1.2.5
      #   manifest.json  -> 1.2.5
      #   GitHub tag     -> 1.2.5
      # ------------------------------------------------------------
      - name: Validate release version
        shell: pwsh
        run: |
          $tagVersion = "${env:GITHUB_REF_NAME}"

          $packageVersion = (
            Get-Content "package.json" -Raw |
            ConvertFrom-Json
          ).version

          $manifestVersion = (
            Get-Content "manifest.json" -Raw |
            ConvertFrom-Json
          ).version

          Write-Host ""
          Write-Host "========================================"
          Write-Host "OpenGantt Release Version"
          Write-Host "========================================"
          Write-Host "Git tag:        $tagVersion"
          Write-Host "package.json:   $packageVersion"
          Write-Host "manifest.json:  $manifestVersion"
          Write-Host ""

          if ($tagVersion -ne $packageVersion) {
            throw "Git tag $tagVersion does not match package.json version $packageVersion."
          }

          if ($tagVersion -ne $manifestVersion) {
            throw "Git tag $tagVersion does not match manifest.json version $manifestVersion."
          }

          if ($packageVersion -ne $manifestVersion) {
            throw "package.json version $packageVersion does not match manifest.json version $manifestVersion."
          }

          Write-Host "Version check passed."
          Write-Host "Release version: $tagVersion"

      # ------------------------------------------------------------
      # Synchronise Tauri version
      #
      # This modifies tauri.conf.json ONLY inside the CI workspace.
      # It is NOT committed back to Git.
      # ------------------------------------------------------------
      - name: Synchronise Tauri version
        shell: pwsh
        run: |
          $packageVersion = (
            Get-Content "package.json" -Raw |
            ConvertFrom-Json
          ).version

          $tauriPath = "src-tauri/tauri.conf.json"

          if (-not (Test-Path $tauriPath)) {
            throw "Tauri configuration not found: $tauriPath"
          }

          $tauri = Get-Content $tauriPath -Raw | ConvertFrom-Json

          $tauri.version = $packageVersion

          $tauri |
            ConvertTo-Json -Depth 100 |
            Set-Content $tauriPath -Encoding UTF8

          $syncedVersion = (
            Get-Content $tauriPath -Raw |
            ConvertFrom-Json
          ).version

          Write-Host "Tauri version: $syncedVersion"

          if ($syncedVersion -ne $packageVersion) {
            throw "Failed to synchronise Tauri version."
          }

      # ------------------------------------------------------------
      # Tests
      # ------------------------------------------------------------
      - name: Run tests
        run: npm test

      # ------------------------------------------------------------
      # Build standalone application
      # ------------------------------------------------------------
      - name: Build standalone application
        run: npm run build:app

      # ------------------------------------------------------------
      # Package standalone application
      # ------------------------------------------------------------
      - name: Package standalone application
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "release-assets" |
            Out-Null

          if (-not (Test-Path "dist/Gantt.html")) {
            throw "dist/Gantt.html was not created by the standalone build."
          }

          Compress-Archive `
            -Path "dist/Gantt.html" `
            -DestinationPath "release-assets/OpenGantt-${env:GITHUB_REF_NAME}-standalone.zip" `
            -CompressionLevel Optimal

          Write-Host "Standalone package created."

      # ------------------------------------------------------------
      # Build Obsidian plugin
      #
      # The Obsidian Community Directory expects:
      #   main.js
      #   manifest.json
      #   styles.css
      #
      # These are uploaded as individual release assets.
      # ------------------------------------------------------------
      - name: Build Obsidian plugin
        run: npm run build

      # ------------------------------------------------------------
      # Prepare Obsidian release assets
      # ------------------------------------------------------------
      - name: Prepare Obsidian release assets
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "release-assets" |
            Out-Null

          # main.js
          if (-not (Test-Path "main.js")) {
            throw "main.js was not created by the Obsidian build."
          }

          # manifest.json
          if (-not (Test-Path "manifest.json")) {
            throw "manifest.json is missing."
          }

          # styles.css
          if (-not (Test-Path "styles.css")) {
            throw "styles.css was not created by the Obsidian build."
          }

          # Copy the files directly into release-assets.
          # DO NOT put them inside a ZIP.
          Copy-Item `
            "main.js" `
            "release-assets/main.js" `
            -Force

          Copy-Item `
            "manifest.json" `
            "release-assets/manifest.json" `
            -Force

          Copy-Item `
            "styles.css" `
            "release-assets/styles.css" `
            -Force

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Obsidian release assets"
          Write-Host "========================================"
          Write-Host ""

          Get-ChildItem "release-assets/main.js" |
            Select-Object Name, Length |
            Format-Table -AutoSize

          Get-ChildItem "release-assets/manifest.json" |
            Select-Object Name, Length |
            Format-Table -AutoSize

          Get-ChildItem "release-assets/styles.css" |
            Select-Object Name, Length |
            Format-Table -AutoSize

      # ------------------------------------------------------------
      # Build Tauri desktop application
      # ------------------------------------------------------------
      - name: Build Tauri Windows application
        run: npx tauri build

      # ------------------------------------------------------------
      # Collect Windows installers
      # ------------------------------------------------------------
      - name: Collect Windows installers
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/release/bundle"

          if (-not (Test-Path $bundleDir)) {
            throw "Tauri bundle directory was not created: $bundleDir"
          }

          $files = Get-ChildItem `
            $bundleDir `
            -Recurse `
            -File |
            Where-Object {
              $_.Extension -in @(".msi", ".exe")
            }

          if ($files.Count -eq 0) {
            throw "No Windows MSI or EXE installers were produced."
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "release-assets" |
            Out-Null

          foreach ($file in $files) {
            Copy-Item `
              $file.FullName `
              "release-assets/$($file.Name)" `
              -Force

            Write-Host "Collected: $($file.Name)"
          }

      # ------------------------------------------------------------
      # Verify final release assets
      # ------------------------------------------------------------
      - name: Verify release assets
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Final release assets"
          Write-Host "========================================"
          Write-Host ""

          $assets = Get-ChildItem "release-assets" -File

          if ($assets.Count -eq 0) {
            throw "No release assets were created."
          }

          $assets |
            Select-Object Name, Length |
            Format-Table -AutoSize

          Write-Host ""

          # --------------------------------------------------------
          # Required Obsidian assets
          # --------------------------------------------------------
          $requiredAssets = @(
            "main.js",
            "manifest.json",
            "styles.css"
          )

          foreach ($asset in $requiredAssets) {
            $path = Join-Path "release-assets" $asset

            if (-not (Test-Path $path)) {
              throw "Required Obsidian release asset is missing: $asset"
            }

            $item = Get-Item $path

            if ($item.Length -eq 0) {
              throw "Required release asset is empty: $asset"
            }

            Write-Host "Verified required asset: $asset"
          }

          # --------------------------------------------------------
          # Verify manifest version one final time
          # --------------------------------------------------------
          $manifest = Get-Content `
            "release-assets/manifest.json" `
            -Raw |
            ConvertFrom-Json

          if ($manifest.version -ne "${env:GITHUB_REF_NAME}") {
            throw "Release manifest version $($manifest.version) does not match Git tag ${env:GITHUB_REF_NAME}."
          }

          Write-Host ""
          Write-Host "All required Obsidian release assets are present."
          Write-Host "Manifest version matches release tag."
          Write-Host "Release asset verification passed."

      # ------------------------------------------------------------
      # Generate GitHub artifact attestations
      #
      # Every file in release-assets is attested:
      #
      #   main.js
      #   manifest.json
      #   styles.css
      #   standalone ZIP
      #   EXE
      #   MSI
      #
      # actions/attest generates signed SLSA build provenance.
      # ------------------------------------------------------------
      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            release-assets/*

      # ------------------------------------------------------------
      # Verify GitHub artifact attestations
      #
      # Every release asset must have a valid attestation before
      # the GitHub Release is created.
      # ------------------------------------------------------------
      - name: Verify artifact attestations
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repository = "${env:GITHUB_REPOSITORY}"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Verifying artifact attestations"
          Write-Host "========================================"
          Write-Host ""

          $assets = Get-ChildItem "release-assets" -File

          if ($assets.Count -eq 0) {
            throw "No release assets found to verify."
          }

          foreach ($asset in $assets) {
            Write-Host "Verifying: $($asset.Name)"

            gh attestation verify `
              "$($asset.FullName)" `
              --repo "$repository"

            if ($LASTEXITCODE -ne 0) {
              throw "Artifact attestation verification failed for $($asset.Name)."
            }

            Write-Host "PASSED: $($asset.Name)"
            Write-Host ""
          }

          Write-Host "========================================"
          Write-Host "All artifact attestations verified."
          Write-Host "========================================"

      # ------------------------------------------------------------
      # Create GitHub Release
      #
      # This happens ONLY after:
      #   1. Builds succeed
      #   2. Required Obsidian files are verified
      #   3. Versions are verified
      #   4. All release assets have attestations
      #   5. All attestations have been cryptographically verified
      # ------------------------------------------------------------
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "OpenGantt ${GITHUB_REF_NAME}" \
            --generate-notes