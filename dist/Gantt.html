<style>/* The standalone app's own page (header, editor pane, divider). It uses the same --og-* palette as the chart, so a theme
   changes both. These defaults are Gruvbox dark; themes override them on <html data-og-theme="...">. */
@layer og-defaults,og-theme;
@layer og-defaults{:root{--og-scheme:dark;--og-bg:#1d2021;--og-surface:#3c3836;--og-surface-2:#504945;--og-line:#665c54;--og-line-2:#7c6f64;--og-fg:#fbf1c7;--og-fg-2:#ebdbb2;--og-fg-3:#d5c4a1;--og-muted:#928374;--og-accent:#fabd2f;--og-on-accent:#1d2021;--og-focus:#83a598;--og-pop-bg:#282828;--og-tip-bg:#32302f;--og-error:#fb4934;--og-error-bg:#3c1f1e;--og-code:#b8bb26;--og-shadow:rgba(0,0,0,.5)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;background:var(--og-pop-bg);color:var(--og-fg-2);font:14px/1.4 Inter,"Segoe UI",system-ui,sans-serif}

.top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--og-bg);border-bottom:1px solid var(--og-surface-2);flex-wrap:wrap}
.brand{width:26px;height:26px;border-radius:6px;flex:none}
.top b{color:var(--og-accent);font-size:15px}
.top .ver{padding:1px 7px;border:1px solid var(--og-line);border-radius:9px;background:transparent;color:var(--og-fg-3);font-size:11px;margin:0 6px 0 0}
.top .ver:hover{color:var(--og-accent);border-color:var(--og-accent)}
.top button{padding:5px 11px;border:1px solid var(--og-line);border-radius:4px;background:var(--og-surface);color:var(--og-fg-2);font:inherit;font-size:12px;cursor:pointer}
.top button:hover:not(:disabled){background:var(--og-surface-2)}
.top button:disabled{opacity:.4;cursor:default}
.top button:focus-visible,.tabs button:focus-visible,#split:focus-visible{outline:2px solid var(--og-focus);outline-offset:1px}
.top .sep{width:1px;height:20px;background:var(--og-surface-2);margin:0 2px}
#file{color:var(--og-fg-3);font-size:12px;margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32ch}
#file.is-dirty{color:var(--og-fg)}
#file.is-dirty::after{content:" \2022";color:var(--og-accent)}
.sp{flex:1}

main{flex:1;min-height:0;display:grid;grid-template-columns:var(--editor-w,440px) 7px minmax(0,1fr)}
.noeditor main{grid-template-columns:minmax(0,1fr)}
.noeditor #editorWrap,.noeditor #split{display:none}
#editorWrap{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--og-bg)}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--og-surface-2)}
.tabs button{padding:6px 14px;border:0;border-bottom:2px solid transparent;border-radius:6px 6px 0 0;background:transparent;color:var(--og-fg-3);font:inherit;font-size:13px;cursor:pointer}
.tabs button:hover{color:var(--og-fg)}
.tabs button.is-active{color:var(--og-accent);border-bottom-color:var(--og-accent)}
#paneVisual,#paneYaml{flex:1;min-height:0;padding:8px}
#paneYaml{padding:0}
#paneYaml .epq-code{border:0;border-radius:0}

/* The draggable divider between editor and chart */
#split{position:relative;cursor:col-resize;background:var(--og-bg);border-left:1px solid var(--og-surface-2);border-right:1px solid var(--og-surface-2);touch-action:none}
#split::after{content:"";position:absolute;top:50%;left:1px;width:3px;height:36px;margin-top:-18px;border-radius:2px;background:var(--og-muted);opacity:.6}
#split:hover,#split.is-dragging{background:var(--og-surface)}
#split:hover::after,#split.is-dragging::after{background:var(--og-accent);opacity:1}
body.is-splitting,body.is-splitting *{cursor:col-resize!important;user-select:none!important}

/* The chart fills its grid cell exactly, so no empty strip is left below the block. */
#chart{min-height:0;min-width:0;padding:10px 14px;overflow:hidden;display:flex;flex-direction:column}
#chart>div{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
#chart .epq-gantt-block{flex:1 1 auto;min-height:0;margin:0;display:flex;flex-direction:column}
#chart .epq-gantt-host{height:auto!important;flex:1 1 auto;min-height:0}
#chart .epq-gantt-resizer{display:none}

/* Scrollbars blend into the theme background: a faint thumb on a transparent track. */
.epq-vis,.epq-codearea,#chart .epq-chart,.epq-dialog-body{scrollbar-width:thin;scrollbar-color:var(--og-surface) transparent}
.epq-vis::-webkit-scrollbar,.epq-codearea::-webkit-scrollbar,#chart .epq-chart::-webkit-scrollbar,.epq-dialog-body::-webkit-scrollbar{width:10px;height:10px}
.epq-vis::-webkit-scrollbar-track,.epq-codearea::-webkit-scrollbar-track,#chart .epq-chart::-webkit-scrollbar-track,.epq-dialog-body::-webkit-scrollbar-track{background:transparent}
.epq-vis::-webkit-scrollbar-thumb,.epq-codearea::-webkit-scrollbar-thumb,#chart .epq-chart::-webkit-scrollbar-thumb,.epq-dialog-body::-webkit-scrollbar-thumb{background:var(--og-surface);background-clip:content-box;border:2px solid transparent;border-radius:6px}
.epq-vis:hover::-webkit-scrollbar-thumb,.epq-codearea:hover::-webkit-scrollbar-thumb,#chart .epq-chart:hover::-webkit-scrollbar-thumb{background:var(--og-surface-2);background-clip:content-box}
.epq-vis::-webkit-scrollbar-thumb:hover,.epq-codearea::-webkit-scrollbar-thumb:hover,#chart .epq-chart::-webkit-scrollbar-thumb:hover{background:var(--og-line);background-clip:content-box}
.epq-codearea::-webkit-scrollbar-corner,#chart .epq-chart::-webkit-scrollbar-corner{background:transparent}

#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:20000}
.toast{padding:8px 12px;border:1px solid var(--og-accent);border-radius:6px;background:var(--og-tip-bg);color:var(--og-fg);font-size:12px;box-shadow:0 4px 14px var(--og-shadow)}
.ctx{position:fixed;z-index:20000;min-width:170px;padding:4px;border:1px solid var(--og-accent);border-radius:6px;background:var(--og-pop-bg);box-shadow:0 6px 20px var(--og-shadow)}
.ctx button{display:block;width:100%;padding:6px 10px;border:0;background:none;color:var(--og-fg-2);font:inherit;font-size:12px;text-align:left;cursor:pointer;border-radius:3px}
.ctx button:hover{background:var(--og-surface-2)}.ctx hr{border:0;border-top:1px solid var(--og-surface-2);margin:4px 0}

@media (max-width:800px){
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:260px 7px 1fr}
  #split{cursor:row-resize;border:0;border-top:1px solid var(--og-surface-2);border-bottom:1px solid var(--og-surface-2)}
  #split::after{left:50%;top:1px;width:36px;height:3px;margin:0 0 0 -18px}
  #editorWrap{border-bottom:0}
}
@media print{.top,#editorWrap,#split,#toasts,.epq-overlay{display:none!important}html,body{height:auto;background:#fff}main{display:block}#chart{display:block;overflow:visible;padding:0}#chart>div,#chart .epq-gantt-block{display:block}}
